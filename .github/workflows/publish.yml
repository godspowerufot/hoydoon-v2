name: Generate a build and push to another branch

on:
  push:
    branches:
      - build # The branch that triggers this workflow

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build and Push
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Install Dependencies
        run: npm install

      - name: Build Project
        run: npm run build # Adjust this if your build command is different

      - name: Push Build to Another Branch
        run: |
          git config --global user.email "github-actions@github.com"
          git config --global user.name "GitHub Actions"
          
          # Fetch latest changes from the build branch
          git fetch origin build || git checkout -b build

          # Switch to the build branch
          git checkout build

          # Remove old files
          rm -rf *

          # Copy new build files
          cp -r .next/* . # Adjust this if your build output is different

          # Stage changes and commit
          git add .
          git commit -m "Automated Build: $(date)" || echo "No changes to commit"

          # Push changes
          git push origin build --force
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
